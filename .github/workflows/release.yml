# 台服 Dalamud 發版：手動觸發，產出啟動器（XIVTCLauncher／FFXIVSimpleLauncher）下載用的 latest.7z＋hashes.json。
# 版號 v<VERSION_BASE>.N：留空＝自動推進 N；填既有版號＝重發（標籤移到這次的 commit、資產覆蓋）。
# dalamud-pin-v13.0.0.* 是插件 CI 的相依包，本流程不碰（版號格式不同，不會被選中）。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版號，例如 7.25.0.3（留空＝自動推進；填既有版號＝重發覆蓋）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: dalamud-release
  cancel-in-progress: false

env:
  VERSION_BASE: '7.25.0'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    # C++ 專案是 v145 工具組（VS 2026）；windows-latest 目前是 windows-2025-vs2026 映像。
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Resolve version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $base = $env:VERSION_BASE
          $tags = @(gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw 'gh release list failed' }
          $vers = @($tags | Where-Object { $_ -match '^v\d+\.\d+\.\d+\.\d+$' } | ForEach-Object { [version]$_.Substring(1) })
          $ceiling = [version]"$base.2147483647"
          $newer = @($vers | Where-Object { $_ -gt $ceiling })
          if ($newer.Count -gt 0) { throw "existing release $($newer[0]) is newer than VERSION_BASE $base; update VERSION_BASE" }
          $inp = "$env:INPUT_VERSION".Trim().TrimStart('v', 'V')
          if ($inp) {
            if ($inp -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "invalid version: $inp" }
            $ver = [version]$inp
          } else {
            $last = $vers | Where-Object { "$($_.Major).$($_.Minor).$($_.Build)" -eq $base } | Sort-Object -Descending | Select-Object -First 1
            $ver = if ($last) { [version]"$base.$($last.Revision + 1)" } else { [version]"$base.1" }
          }
          $tag = "v$ver"
          $exists = $tags -contains $tag
          $top = @($vers + $ver | Sort-Object -Descending)[0]
          $latest = if ($top -eq $ver) { 'true' } else { 'false' }
          "VER=$ver", "TAG=$tag", "REPUBLISH=$($exists.ToString().ToLowerInvariant())", "MAKE_LATEST=$latest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "version $ver tag $tag republish=$exists latest=$latest"

      - name: Locate MSBuild
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild.exe not found' }
          "MSBuild=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "MSBuild: $msbuild"

      - name: Build
        run: .\build.ps1 compile --configuration Release

      # 計時型測試在代管機器上偶爾等不到執行緒池（Task 停在 WaitingToRun）；失敗重跑一次，連兩次失敗才算壞。
      - name: Test
        run: |
          dotnet test .\Dalamud.Test\Dalamud.Test.csproj -c Release --no-restore -p:WarningLevel=0
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::warning::tests failed once; retrying'
            dotnet test .\Dalamud.Test\Dalamud.Test.csproj -c Release --no-restore -p:WarningLevel=0
            if ($LASTEXITCODE -ne 0) { throw 'tests failed twice' }
          }

      - name: Check build output
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'bin/Release'
          foreach ($f in 'Dalamud.Injector.exe', 'Dalamud.dll', 'Dalamud.Boot.dll', 'FFXIVClientStructs.dll', 'cimgui.dll', 'DalamudCrashHandler.exe', 'verified-game-versions.txt') {
            if (-not (Test-Path -LiteralPath (Join-Path $out $f))) { throw "missing $f in $out" }
          }
          $hash = (Get-Content -Raw -LiteralPath (Join-Path $out 'commit_hash.txt')).Trim()
          if (-not $hash.StartsWith($env:GITHUB_SHA)) { throw "commit_hash.txt '$hash' does not match $env:GITHUB_SHA" }
          if ($hash.EndsWith('-dirty')) { Write-Host '::warning::working tree was dirty during build' }
          Get-ChildItem -LiteralPath $out -Filter *.log -File | Remove-Item -Force

      - name: 帳號痕跡閘門（上傳前；needle 由 secret 提供，讀不到就不放行）
        env:
          LEAK_GUARD_NEEDLE: ${{ secrets.LEAK_GUARD_NEEDLE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $n = "$env:LEAK_GUARD_NEEDLE".Trim().ToLowerInvariant()
          if ($n.Length -lt 4 -or $n -cnotmatch '^[a-z0-9_.-]+$') { throw "secret LEAK_GUARD_NEEDLE is empty or malformed (length $($n.Length)); refusing to upload" }
          $L = [Text.Encoding]::Latin1
          $cases = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          [void]$cases.Add($n); [void]$cases.Add($n.Substring(0, 1).ToUpperInvariant() + $n.Substring(1)); [void]$cases.Add($n.ToUpperInvariant())
          $pats = @(foreach ($c in $cases) { ,@($c, 1); ,@((-join ($c.ToCharArray() | ForEach-Object { [string]$_ + [char]0 })), 2) })
          $full = [int][Math]::Floor($n.Length / 3) * 3
          $b64 = @(foreach ($c in $cases) { [Convert]::ToBase64String($L.GetBytes($c.Substring(0, $full))) })
          function Get-Hits([byte[]]$raw) {
            $s = $L.GetString($raw); $h = 0
            foreach ($p in $pats) {
              $i = $s.IndexOf($p[0], [StringComparison]::Ordinal)
              while ($i -ge 0) {
                if ($i -lt $p[1] -or $s[$i - $p[1]] -notmatch '[A-Za-z0-9_]') { $h++ }
                $i = $s.IndexOf($p[0], $i + 1, [StringComparison]::Ordinal)
              }
            }
            foreach ($b in $b64) { $i = $s.IndexOf($b, [StringComparison]::Ordinal); while ($i -ge 0) { $h++; $i = $s.IndexOf($b, $i + 1, [StringComparison]::Ordinal) } }
            return $h
          }
          $files = @(Get-ChildItem -LiteralPath 'bin/Release' -Recurse -File -Force)
          if ($files.Count -lt 50) { throw "leak guard saw only $($files.Count) files; refusing to upload" }
          $bad = 0
          foreach ($f in $files) {
            $c = Get-Hits ([IO.File]::ReadAllBytes($f.FullName))
            if ($c -gt 0) { $bad++; Write-Host "::error::leak guard hit: $($f.Name) real=$c" }
          }
          if ($bad -gt 0) { throw "leak guard blocked $bad file(s)" }
          Write-Host "leak guard clean: $($files.Count) file(s)"

      - name: Package
        run: |
          $ErrorActionPreference = 'Stop'
          .\CreateHashList.ps1 .\bin\Release
          if ($LASTEXITCODE) { throw 'CreateHashList failed' }
          Set-Location $env:GITHUB_WORKSPACE
          $stage = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Push-Location -LiteralPath .\bin\Release
          try {
            7z a -t7z (Join-Path $stage 'latest.7z') * -mx=9 | Out-Null
            if ($LASTEXITCODE) { throw '7z failed' }
          } finally { Pop-Location }
          Copy-Item -LiteralPath .\bin\Release\hashes.json -Destination $stage
          $hashes = Get-Content -Raw -LiteralPath (Join-Path $stage 'hashes.json') | ConvertFrom-Json -AsHashtable
          foreach ($f in 'Dalamud.Injector.exe', 'Dalamud.dll', 'FFXIVClientStructs.dll', 'verified-game-versions.txt') {
            if (-not $hashes.ContainsKey($f)) { throw "hashes.json lacks $f" }
          }
          $check = Join-Path $env:RUNNER_TEMP 'extract-check'
          7z x (Join-Path $stage 'latest.7z') "-o$check" -y | Out-Null
          if ($LASTEXITCODE) { throw '7z extract check failed' }
          $mismatch = 0
          foreach ($k in $hashes.Keys) {
            $p = Join-Path $check $k
            if (-not (Test-Path -LiteralPath $p)) { $mismatch++; Write-Host "::error::missing in archive: $k"; continue }
            if ((Get-FileHash -LiteralPath $p -Algorithm MD5).Hash -ne $hashes[$k]) { $mismatch++; Write-Host "::error::hash mismatch: $k" }
          }
          if ($mismatch -gt 0) { throw "$mismatch archive entries do not match hashes.json" }
          Get-ChildItem -LiteralPath $stage | ForEach-Object { Write-Host "$($_.Name) $($_.Length) sha256=$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)" }
          "STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $games = @(Get-Content -LiteralPath 'Dalamud/verified-game-versions.txt' | ForEach-Object { ($_ -split '#')[0].Trim() } | Where-Object { $_ })
          $notes = @(
            "台服 Dalamud $env:VER（API13／net9）"
            ''
            "- Commit：$env:GITHUB_SHA（$env:GITHUB_REF_NAME）"
            "- 已驗證遊戲版本：$($games -join '、')（其他版本啟動時會先詢問是否載入）"
            '- 資產：latest.7z（解壓到啟動器的 Dalamud 目錄）、hashes.json（各檔 MD5）'
            "- 建置：$env:GITHUB_SERVER_URL/$repo/actions/runs/$env:GITHUB_RUN_ID"
          ) -join "`n"
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding utf8NoBOM
          $files = @((Join-Path $env:STAGE 'latest.7z'), (Join-Path $env:STAGE 'hashes.json'))
          if ($env:REPUBLISH -eq 'true') {
            gh api -X PATCH "repos/$repo/git/refs/tags/$env:TAG" -f sha=$env:GITHUB_SHA -F force=true | Out-Null
            if ($LASTEXITCODE) { throw 'moving tag failed' }
            gh release upload $env:TAG @files --repo $repo --clobber
            if ($LASTEXITCODE) { throw 'upload failed' }
            gh release edit $env:TAG --repo $repo --title "Dalamud $env:VER" --notes-file $notesFile "--latest=$env:MAKE_LATEST"
            if ($LASTEXITCODE) { throw 'edit failed' }
          } else {
            gh release create $env:TAG @files --repo $repo --target $env:GITHUB_SHA --title "Dalamud $env:VER" --notes-file $notesFile "--latest=$env:MAKE_LATEST"
            if ($LASTEXITCODE) { throw 'create failed' }
          }
          gh release view $env:TAG --repo $repo --json tagName,assets --jq '{tag: .tagName, assets: [.assets[] | {name, size}]}'
          Write-Host "releases/latest -> $(gh api "repos/$repo/releases/latest" --jq .tag_name)"
